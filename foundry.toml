[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
evm_version = "paris"   # safe for both our 0.8.24 code and Morpho's pinned 0.8.19
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "morpho-blue/=lib/morpho-blue/src/",
  "morpho-blue-irm/=lib/morpho-blue-irm/src/",
  "forge-std/=lib/forge-std/src/",
  "ds-test/=lib/forge-std/lib/ds-test/src/",
]

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
monad = "${MONAD_MAINNET_RPC_URL}"
ethereum = "${ETHEREUM_RPC_URL}"
tempo_testnet = "${TEMPO_TESTNET_RPC_URL}"
tempo = "${TEMPO_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
elysium_testnet = "${ELYSIUM_TESTNET_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
